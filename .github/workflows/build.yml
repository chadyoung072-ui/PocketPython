name: Build Pocket Python APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/example/pocketpython
          mkdir -p app/src/main/python
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'PocketPython'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'com.chaquo.python' version '16.1.0' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'com.chaquo.python'
          }

          android {
              namespace 'com.example.pocketpython'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.pocketpython'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'

                  ndk {
                      abiFilters 'arm64-v8a', 'armeabi-v7a'
                  }

                  python {
                      version '3.11'
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Pocket Python"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/python/runner.py <<'EOF'
          import contextlib
          import io
          import traceback

          def run_code(source):
              output = io.StringIO()
              scope = {"__name__": "__main__"}
              try:
                  with contextlib.redirect_stdout(output), contextlib.redirect_stderr(output):
                      exec(compile(source, "<pocket-python>", "exec"), scope, scope)
              except BaseException:
                  traceback.print_exc(file=output)
              result = output.getvalue()
              return result if result else "(Program finished with no output.)"
          EOF

          cat > app/src/main/java/com/example/pocketpython/MainActivity.java <<'EOF'
          package com.example.pocketpython;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import com.chaquo.python.Python;
          import com.chaquo.python.android.AndroidPlatform;

          public class MainActivity extends Activity {
              private EditText editor;
              private TextView output;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (!Python.isStarted()) {
                      Python.start(new AndroidPlatform(this));
                  }
                  buildScreen();
              }

              private LinearLayout.LayoutParams proportionalParams(float weight) {
                  return new LinearLayout.LayoutParams(0, -1, weight);
              }

              private Button button(String label, Runnable action) {
                  Button button = new Button(this);
                  button.setText(label);
                  button.setOnClickListener(view -> action.run());
                  return button;
              }

              private void buildScreen() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 24, 24, 24);

                  TextView title = new TextView(this);
                  title.setText("Pocket Python");
                  title.setTextSize(24);
                  title.setTypeface(null, Typeface.BOLD);
                  root.addView(title);

                  editor = new EditText(this);
                  editor.setTypeface(Typeface.MONOSPACE);
                  editor.setGravity(Gravity.TOP | Gravity.START);
                  editor.setText("print('Hello from Pocket Python!')\nfor i in range(3):\n    print('Count:', i + 1)");
                  editor.setLayoutParams(proportionalParams(2));
                  root.addView(editor);

                  output = new TextView(this);
                  output.setTypeface(Typeface.MONOSPACE);
                  output.setTextColor(0xFFFFFFFF);
                  output.setBackgroundColor(0xFF111827);
                  output.setPadding(16, 16, 16, 16);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setLayoutParams(proportionalParams(1));
                  scroll.addView(output);
                  root.addView(scroll);

                  Button run = button("Run", this::runPython);
                  root.addView(run);

                  setContentView(root);
              }

              private void runPython() {
                  output.setText("Running...");
                  String code = editor.getText().toString();
                  new Thread(() -> {
                      String result;
                      try {
                          result = Python.getInstance()
                              .getModule("runner")
                              .callAttr("run_code", code)
                              .toString();
                      } catch (Exception error) {
                          result = "Error: " + error;
                      }
                      final String text = result;
                      runOnUiThread(() -> output.setText(text));
                  }).start();
              }
          }
          EOF

          gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketPython-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
